<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dumppiryekonomi</title>
<style>
:root{--m:#7b1e2e;--m2:#5c1421;--bg:#fff;--card:#fff;--tx:#2a1a1d;--soft:#f6e9ea;--line:#e6d6d8;color-scheme:light}
:root[data-theme="dark"]{--bg:#1d1416;--card:#2a1d20;--tx:#f3e8ea;--soft:#3a2428;--line:#4a3035}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:1000px;margin:0 auto;min-height:100vh;padding:24px 16px;display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap}
.phone{width:340px;height:680px;border:10px solid #111;border-radius:38px;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3);flex:none}
.top{background:var(--m);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
.top button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;width:32px;height:30px;font-size:1rem;cursor:pointer}
.pts{margin-left:auto;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;font-size:.8rem}
.view{flex:1;overflow-y:auto;padding:14px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
.nav button{flex:1;border:0;background:none;padding:10px 0;font-size:1.2rem;cursor:pointer;color:var(--tx)}
.nav button.on{background:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;font-size:.72rem;cursor:pointer;color:var(--tx)}
.tile span{display:block;font-size:1.5rem;margin-bottom:4px}
.tile.big{grid-column:1/-1;background:var(--soft);padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font-size:.85rem}
.btn{background:var(--m);color:#fff;border:0;border-radius:10px;padding:11px;width:100%;font-weight:600;cursor:pointer;font-size:.9rem}
.btn:disabled{opacity:.5}
.btn.s{width:auto;padding:6px 12px;font-size:.78rem}
input[type=text],input[type=password]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--card);color:var(--tx);font-size:.9rem}
h3{margin:0 0 10px;color:var(--m)}
.login{display:flex;flex-direction:column;justify-content:center;flex:1;padding:24px;text-align:center}
.login{background:#fff}.login .lg{width:180px;border-radius:50%;margin:0 auto 26px;display:block}
.peng{position:relative;text-align:center;height:130px;margin:6px 0}
.peng .acc{position:absolute;left:0;right:0;top:-12px;font-size:2.4rem;line-height:1}
.peng .acc.g{top:20px;font-size:1.8rem}
.timer{font-size:2.4rem;font-weight:700;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--m)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--m);color:var(--m);border-radius:14px;padding:3px 10px;font-size:.72rem;background:none;cursor:pointer}
.chip.on{background:var(--m);color:#fff}
.wheelbox{position:relative;width:220px;height:220px;margin:6px auto 14px}
.wheel{width:100%;height:100%;border-radius:50%;border:4px solid var(--m);transition:transform 4s cubic-bezier(.15,.7,.1,1);position:relative}
.wheel i{position:absolute;left:50%;top:50%;transform-origin:0 0;font-style:normal;font-size:.62rem;font-weight:700;width:80px;text-align:right;color:#222}
.ptr{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:1.6rem;color:var(--m)}
.ov{position:absolute;inset:0;background:#fff;z-index:3;overflow-y:auto;padding:16px}.toast{z-index:4;position:absolute;left:14px;right:14px;bottom:70px;background:#111;color:#fff;padding:10px 12px;border-radius:10px;font-size:.82rem;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none!important}
@media (max-width:480px){.wrap{padding:0}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0}}
.meta{font-size:.74rem;opacity:.85;display:flex;align-items:center;gap:6px}.th{cursor:pointer}.lk{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:3px 10px;cursor:pointer;font-size:.78rem;color:var(--tx)}.lk.on{background:var(--soft);border-color:var(--m);color:var(--m)}
</style>
</head>
<body>
<div class="wrap" id="demo">
  <div class="phone" id="phone">
    <div id="login" class="login">
      <img src="assets/dumppi-logo.png" alt="Dumppi ry logo" class="lg">
      <input type="text" id="u" placeholder="Käyttäjätunnus" autocomplete="off">
      <input type="password" id="p" placeholder="Salasana" onkeydown="if(event.key==='Enter')login()">
      <button class="btn" onclick="login()">Kirjaudu</button>
    </div>
    <div id="app" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="top"><button onclick="go('menu')">☰</button><span id="ttl">Valikko</span><span class="pts" id="pts">0 p</span></div>
      <div class="view" id="view"></div>
      <div class="nav">
        <button data-n="menu" onclick="go('menu')">🏠</button>
        <button data-n="notif" onclick="go('notif')">🔔</button>
        <button data-n="chat" onclick="go('chat')">💬</button>
        <button data-n="shop" onclick="go('shop')">🛍️</button>
      </div>
    </div>
    <div class="ov hide" id="ov"></div><div class="toast" id="toast"></div>
  </div>
</div>

<script>
const S={name:'Kasa',pts:120,owned:{},equip:{},timer:null,chan:'#kysymykset',spun:false,
 thr:null,chan:'#kysymykset',nt:false,tid:10,
 threads:[
 {id:1,c:'#kysymykset',title:'Kuka tulee lähteelle opiskelemaan?',a:'Ville Valmistunut',t:'Väsyttää tää tentti… kuka tulee lähteelle opiskelemaan?',likes:4,liked:0,rep:[{a:'Lyydia Lyhty',t:'Mä tuon! Otan kahvit mukaan.',likes:2,liked:0},{a:'Kari Kukkaro',t:'Lähdetäänkö klo 14?',likes:1,liked:0}]},
 {id:2,c:'#kysymykset',title:'Mitä kursseja syksyllä kannattaa ottaa?',a:'Kaisa Kandi',t:'Onko jollain vinkkiä helppoihin valinnaisiin?',likes:3,liked:0,rep:[{a:'Anonyymi',t:'Kysy toimistolta, siellä on kokemusta!',likes:1,liked:0}]},
 {id:3,c:'#vitsejä',title:'Päivän pingviinivitsi',a:'Anonyymi',t:'Mikä on pingviinin lempiaine? Pakkasmatematiikka.',likes:9,liked:0,rep:[{a:'Kari Kukkaro',t:'Hyvä, täytyy kertoa Dumpilla 😄',likes:3,liked:0}]},
 {id:4,c:'#opiskelusuunnitelma',title:'Viikon tavoite: 10 h lukemista',a:'Kaisa Kandi',t:'Kuka lähtee mukaan haasteeseen? Kerätään pisteitä yhdessä.',likes:6,liked:0,rep:[]},
 {id:5,c:'#dumppi-yleinen',title:'Tervetuloa Dumppi ry:n chattiin!',a:'Hallitus',t:'Täällä voi keskustella anonyymisti tai omalla nimellä. Muistathan hyvät tavat.',likes:12,liked:0,rep:[]}],
 shop:[
  {id:'hat',n:'Pipo',p:40,i:'🧢',s:'t'},{id:'gl',n:'Lasit',p:20,i:'🕶️',s:'g'},
  {id:'bow',n:'Rusetti',p:30,i:'🎀',s:'g'},{id:'cr',n:'Kruunu',p:200,i:'👑',s:'t'},
  {id:'hw',n:'Halloween-hattu',p:60,i:'🎃',s:'t'},{id:'xm',n:'Joulupipo',p:50,i:'🎅',s:'t'}],
 events:[['Ke 14.10.','Dumppi auki 9–14'],['Pe 16.10.','Pelailuilta klo 17'],['Ti 20.10.','Yritysvierailu: tulossa'],['To 29.10.','Halloween-bileet 🎃']]};
const $=s=>document.querySelector(s),v=$('#view');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function login(){S.name=$('#u').value.trim()||'Kasa';$('#login').classList.add('hide');$('#app').classList.remove('hide');go('menu')}
function pts(){$('#pts').textContent=S.pts+' p'}
function go(n){S.cur=n;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===n));pts();
 const T={menu:'Valikko',notif:'Ilmoitukset',cal:'Kalenteri',set:'Asetukset',wheel:'Onnenpyörä',shop:'Kauppa',rew:'Palkinnot',chat:'Dumppi chat',game:'Motivaatiopingviini'};
 $('#ttl').textContent=T[n];v.innerHTML=R[n]();if(n==='game'&&!S.seen){S.seen=1;openWheel()}}
function openWheel(){const o=$('#ov');o.innerHTML='<div class="card"><b>Tervetuloa peliin! 🐧</b><br>Pyöräytä onnenpyörää ensimmäisen kerran.</div>'+R.wheel()+'<button class="btn" style="margin-top:8px;background:#999" onclick="closeOv()">Sulje</button>';o.classList.remove('hide')}
function closeOv(){$('#ov').classList.add('hide');go(S.cur)}
function PS(s){return `<svg width="${s}" height="${s*1.08}" viewBox="0 0 120 130" style="vertical-align:middle"><ellipse cx="20" cy="82" rx="9" ry="27" transform="rotate(14 20 82)" fill="#2e2e2e"/><ellipse cx="100" cy="82" rx="9" ry="27" transform="rotate(-14 100 82)" fill="#2e2e2e"/><ellipse cx="60" cy="80" rx="38" ry="45" fill="#2e2e2e"/><circle cx="60" cy="38" r="28" fill="#2e2e2e"/><ellipse cx="60" cy="86" rx="26" ry="34" fill="#efe9de"/><circle cx="48" cy="38" r="10" fill="#fff" stroke="#888" stroke-width="2"/><circle cx="72" cy="38" r="10" fill="#fff" stroke="#888" stroke-width="2"/><circle cx="48" cy="39" r="3.5" fill="#222"/><circle cx="72" cy="39" r="3.5" fill="#222"/><path d="M54 49h12l-6 9z" fill="#f39c12"/><text x="60" y="88" font-size="9" font-weight="700" text-anchor="middle" fill="#7b1e2e" font-family="Impact,sans-serif">DUMPPI</text><ellipse cx="44" cy="124" rx="12" ry="5" fill="#f39c12"/><ellipse cx="76" cy="124" rx="12" ry="5" fill="#f39c12"/></svg>`}
function peng(){const h=S.shop.find(x=>x.id===S.equip.t),g=S.shop.find(x=>x.id===S.equip.g);
 return `<div class="peng">${PS(112)}${h?`<span class="acc">${h.i}</span>`:''}${g?`<span class="acc g">${g.i}</span>`:''}</div>`}
const R={
menu:()=>`<p style="margin:0 0 12px">Moi, <b>${S.name}</b>! 👋</p><div class="grid">
 <div class="tile" onclick="go('notif')"><span>🔔</span>Ilmoitukset</div>
 <div class="tile" onclick="go('cal')"><span>📅</span>Kalenteri</div>
 <div class="tile" onclick="go('set')"><span>⚙️</span>Asetukset</div>
 <div class="tile" onclick="go('wheel')"><span>🎡</span>Onnenpyörä</div>
 <div class="tile" onclick="go('shop')"><span>👕</span>Kauppa</div>
 <div class="tile" onclick="go('rew')"><span>🏆</span>Palkinnot</div>
 <div class="tile" onclick="go('game')"><span>🐧</span>Pingviini</div>
 <div class="tile big" onclick="go('chat')"><span>🐧</span>Dumppi chat</div></div>`,
notif:()=>`<div class="card">🐧 <b>Dumppi sitsit!</b><br><small>Uudistettu ilmoitus</small></div>
 <div class="card">🕘 <b>Toimisto päivystää tänään 9–14.</b></div>
 <div class="card">📣 <b>Kaikki tiedotteet koottu ilmoituspalstalle.</b></div>
 <p style="font-size:.78rem;opacity:.7">Ilmoitukset-sivulta löytää ajankohtaista tietoa tulevista tapahtumista ja harjoittelupaikoista.</p>`,
cal:()=>`<h3>Tulevat tapahtumat</h3>`+S.events.map(e=>`<div class="card row"><b style="color:var(--m);width:70px">${e[0]}</b><span>${e[1]}</span></div>`).join(''),
set:()=>`<div class="card row"><span class="grow">Ilmoitukset</span><input type="checkbox" checked></div>
 <div class="card row"><span class="grow">Tumma teema</span><input type="checkbox" onchange="document.documentElement.dataset.theme=this.checked?'dark':'light'"></div>
 <div class="card row"><span class="grow">Demo-nopeus ajastimessa</span><input type="checkbox" id="dm" ${S.demo===false?'':'checked'} onchange="S.demo=this.checked"></div>
 <button class="btn" onclick="location.reload()">Kirjaudu ulos</button>`,
play:()=>`<div class="card"><b>Pelin idea:</b> Pelissä voi asettaa opiskelijalle ajan, jonka jälkeen saa pisteitä.</div>${peng()}
 <div class="timer" id="tm">25:00</div>
 <div class="row"><span>Aseta aika</span><input class="grow" type="range" min="1" max="120" value="25" id="rg" oninput="setT(this.value)"><b id="rv">25 min</b></div><br>
 <button class="btn" id="sb" onclick="startT()">Aloita opiskelu</button>
 <p style="font-size:.72rem;opacity:.7;text-align:center">1 minuutti = 1 piste. Demo-nopeudella 1 min kestää 1 s.</p>`,
game:()=>`<div class="row" style="margin-bottom:10px"><button class="btn s grow ${S.gt==='shop'?'':'on'}" style="${S.gt==='shop'?'background:var(--soft);color:var(--m)':''}" onclick="S.gt='play';go('game')">🐧 Pelaa</button><button class="btn s grow" style="${S.gt==='shop'?'':'background:var(--soft);color:var(--m)'}" onclick="S.gt='shop';go('game')">🛍️ Kauppa</button><button class="btn s" style="background:var(--soft);color:var(--m)" onclick="openWheel()">🎡</button></div>`+(S.gt==='shop'?peng()+R.shop():R.play()),
shop:()=>`<div class="card"><b>Pingviinin varusteet</b><br><small>Vaatteita vaihtuu kausittain (joulu, halloween…)</small></div>`+
 S.shop.map(x=>{const o=S.owned[x.id],e=S.equip[x.s]===x.id;return `<div class="card row"><span style="font-size:1.8rem">${x.i}</span><span class="grow"><b>${x.n}</b><br><small>${x.p} p</small></span>
 <button class="btn s" onclick="buy('${x.id}')">${e?'Päällä ✓':o?'Pue':'Osta'}</button></div>`}).join(''),
rew:()=>`<h3>Palkinnot</h3><div class="card">🥉 Ensimmäinen opiskelusessio – ${S.done?'✅':'🔒'}</div>
 <div class="card">🥈 Osta ensimmäinen varuste – ${Object.keys(S.owned).length?'✅':'🔒'}</div>
 <div class="card">🥇 Kerää 300 pistettä – ${S.pts>=300?'✅':'🔒'}</div>`,
wheel:()=>{const P=['Kahvi ☕','Tarra','+20 p','Pingviini 🐧','+50 p','Kuppi'],C=['#f6d7da','#fff','#f6d7da','#fff','#f6d7da','#fff'];
 return `<p style="font-size:.82rem">Viikoittain mahdollisuus pyöräyttää Dumpin onnenpyörää. Voit voittaa palkintoja!</p><div class="wheelbox"><div class="ptr">▼</div>
 <div class="wheel" id="wh" style="background:conic-gradient(${C.map((c,i)=>`${c} ${i*60}deg ${i*60+60}deg`).join(',')})">
 ${P.map((p,i)=>`<i style="transform:rotate(${i*60+30-90}deg) translate(12px,-6px)">${p}</i>`).join('')}</div></div>
 <button class="btn" id="spin" onclick="spin()" ${S.spun?'disabled':''}>${S.spun?'Seuraava pyöräytys viikon päästä':'Pyöräytä'}</button>
 ${S.spun?`<p style="text-align:center"><a href="#" onclick="S.spun=false;go(S.cur);return false" style="font-size:.72rem;color:var(--m)">demo: nollaa</a></p>`:''}`},
chat:()=>{if(typeof S.thr==='string')return liveThread();const t=S.threads.find(x=>x.id===S.thr);
 if(t)return `<button class="chip" onclick="S.thr=null;go('chat')">← Takaisin</button><h3 style="margin-top:10px">${t.title}</h3>
 <div class="card"><div class="meta">${PS(26)} <b>${t.a}</b></div><p style="margin:8px 0">${t.t}</p><button class="lk ${t.liked?'on':''}" onclick="likeT(${t.id})">❤️ ${t.likes}</button></div>
 <b style="font-size:.8rem">Vastaukset (${t.rep.length})</b>
 ${t.rep.map((x,k)=>`<div class="card"><div class="meta">${PS(24)} <b>${x.a}</b></div><p style="margin:6px 0">${x.t}</p><button class="lk ${x.liked?'on':''}" onclick="likeR(${t.id},${k})">❤️ ${x.likes}</button></div>`).join('')}
 <div class="row"><input type="text" id="ci" placeholder="Kirjoita vastaus…" style="margin:0" onkeydown="if(event.key==='Enter')reply(${t.id})"><button class="btn s" onclick="reply(${t.id})">➤</button></div>
 <label style="font-size:.74rem;display:block;margin-top:8px"><input type="checkbox" id="an"> Vastaa anonyymisti</label>`;
 return `<div class="card" style="font-size:.76rem">Dumppi chat on foorumi, jossa voi keskustella muiden dumppareiden kanssa anonyymisti tai omalla käyttäjänimellä.</div>
 <div style="font-size:.72rem;margin:-2px 0 8px">${LIVE.mode==='fb'?'🟢 Live – viestit näkyvät kaikille 10 min':'⚪ Demo-tila – viestit näkyvät vain sinulle'}</div><div class="chips">${['#kysymykset','#vitsejä','#opiskelusuunnitelma','#dumppi-yleinen'].map(c=>`<button class="chip ${c===S.chan?'on':''}" onclick="S.chan='${c}';go('chat')">${c}</button>`).join('')}</div>
 ${newBtn()}
 ${S.nt?`<div class="card"><input type="text" id="nti" placeholder="Otsikko"><input type="text" id="ntt" placeholder="Viesti"><label style="font-size:.74rem"><input type="checkbox" id="an"> Julkaise anonyymisti</label><br><br><button class="btn" onclick="addT()">Julkaise</button></div>`:''}
 ${liveCards()}${S.threads.filter(x=>x.c===S.chan).map(x=>`<div class="card th" onclick="S.thr=${x.id};go('chat')"><b>${x.title}</b><div class="meta">${PS(22)} ${x.a} · 💬 ${x.rep.length} · ❤️ ${x.likes}</div></div>`).join('')||'<p style="opacity:.6;font-size:.82rem">Ei vielä keskusteluja.</p>'}`}
};
const I={};
let mins=25;
function setT(x){mins=+x;$('#rv').textContent=x+' min';$('#tm').textContent=String(x).padStart(2,'0')+':00'}
function startT(){const b=$('#sb');
 if(S.timer){clearInterval(S.timer);S.timer=null;b.textContent='Aloita opiskelu';$('#rg').disabled=false;toast('Keskeytetty – ei pisteitä');setT(mins);return}
 let left=mins*60,step=($('#dm')?$('#dm').checked:S.demo!==false)?60:1;$('#rg').disabled=true;b.textContent='Keskeytä';
 S.timer=setInterval(()=>{left-=step;const tm=$('#tm');if(!tm){clearInterval(S.timer);S.timer=null;return}
  if(left<=0){clearInterval(S.timer);S.timer=null;S.pts+=mins;S.done=true;pts();tm.textContent='00:00';b.textContent='Aloita opiskelu';$('#rg').disabled=false;toast(`Hyvää työtä! +${mins} pistettä 🎉`);return}
  tm.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')},1000)}
function buy(id){const x=S.shop.find(y=>y.id===id);
 if(!S.owned[id]){if(S.pts<x.p){toast('Pisteet eivät riitä 😢');return}S.pts-=x.p;S.owned[id]=1;toast(x.n+' ostettu!')}
 S.equip[x.s]=S.equip[x.s]===id?null:id;go(S.cur)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function who(){return $('#an')&&$('#an').checked?'Anonyymi':S.name}
function likeT(id){const t=S.threads.find(x=>x.id===id);t.liked=!t.liked;t.likes+=t.liked?1:-1;go('chat')}
function likeR(id,k){const x=S.threads.find(y=>y.id===id).rep[k];x.liked=!x.liked;x.likes+=x.liked?1:-1;go('chat')}
function reply(id){const i=$('#ci');if(!i.value.trim())return;const t=S.threads.find(x=>x.id===id);
 t.rep.push({a:who(),t:esc(i.value),likes:0,liked:0});go('chat');
 setTimeout(()=>{t.rep.push({a:'Lyydia Lyhty',t:'Hyvä pointti! 👍',likes:0,liked:0});if(S.thr===id&&$('#ci'))go('chat')},1500)}
const LIVE={mode:'demo',uid:'me',posts:{},likes:{},comments:{},
 refresh(){if(S.cur!=='chat')return;const a=document.activeElement;if(a&&a.tagName==='INPUT')return;go('chat')},
 post(p){LIVE.posts[LIVE.uid]={...p,ts:Date.now()};delete LIVE.likes[LIVE.uid];delete LIVE.comments[LIVE.uid];return Promise.resolve()},
 like(pid,on){const l=LIVE.likes[pid]=LIVE.likes[pid]||{};on?l[LIVE.uid]=true:delete l[LIVE.uid];return Promise.resolve()},
 comment(pid,c){const m=LIVE.comments[pid]=LIVE.comments[pid]||{};m[LIVE.uid]={...c,ts:Date.now()};return Promise.resolve()},
 del(pid){delete LIVE.posts[pid];delete LIVE.likes[pid];delete LIVE.comments[pid];return Promise.resolve()}};
const TTL=600000;
function mine(){const m=LIVE.posts[LIVE.uid];return m&&m.ts&&Date.now()-m.ts<TTL?m:null}
function left(p){return Math.max(1,Math.ceil((p.ts+TTL-Date.now())/60000))}
function lc(k){return Object.keys(LIVE.likes[k]||{}).length}
function cc(k){return Object.keys(LIVE.comments[k]||{}).length}
function newBtn(){const m=mine();
 if(m)return `<button class="btn" style="margin-bottom:10px;background:#999" disabled>Sinulla on jo viesti (vanhenee ${left(m)} min)</button>`;
 return `<button class="btn" style="margin-bottom:10px" onclick="S.nt=!S.nt;go('chat')">${S.nt?'Peruuta':'＋ Uusi viesti'}</button>`}
function liveList(){const n=Date.now();return Object.entries(LIVE.posts).filter(([k,p])=>p&&p.ts&&n-p.ts<TTL&&p.chan===S.chan).sort((a,b)=>b[1].ts-a[1].ts)}
function liveCards(){return liveList().map(([k,p])=>`<div class="card th" style="border-color:var(--m)" onclick="S.thr='L:${esc(k)}';go('chat')"><b>${esc(p.title)}</b><div class="meta">${PS(22)} ${esc(p.name)} · ❤️ ${lc(k)} · 💬 ${cc(k)} · 🔴 ${left(p)} min</div></div>`).join('')}
function liveThread(){const k=S.thr.slice(2),p=LIVE.posts[k];
 if(!p||!p.ts||Date.now()-p.ts>=TTL){S.thr=null;return '<p>Viesti on vanhentunut.</p><button class="btn" onclick="go(\'chat\')">Takaisin</button>'}
 const on=LIVE.likes[k]&&LIVE.likes[k][LIVE.uid],cm=Object.values(LIVE.comments[k]||{}).sort((a,b)=>a.ts-b.ts),did=LIVE.comments[k]&&LIVE.comments[k][LIVE.uid];
 return `<button class="chip" onclick="S.thr=null;go('chat')">← Takaisin</button><h3 style="margin-top:10px">${esc(p.title)}</h3>
 <div class="card"><div class="meta">${PS(26)} <b>${esc(p.name)}</b> · vanhenee ${left(p)} min</div><p style="margin:8px 0">${esc(p.text||'')}</p><button class="lk ${on?'on':''}" onclick="likeLive('${esc(k)}')">❤️ ${lc(k)}</button></div>
 <b style="font-size:.8rem">Kommentit (${cm.length})</b>
 ${cm.map(x=>`<div class="card"><div class="meta">${PS(24)} <b>${esc(x.name)}</b></div><p style="margin:6px 0">${esc(x.text)}</p></div>`).join('')}
 ${did?'<p style="font-size:.74rem;opacity:.7">Olet jo kommentoinut tätä viestiä.</p>':`<div class="row"><input type="text" id="cmi" placeholder="Kirjoita kommentti…" style="margin:0" onkeydown="if(event.key==='Enter')addComment('${esc(k)}')"><button class="btn s" onclick="addComment('${esc(k)}')">➤</button></div><label style="font-size:.74rem;display:block;margin-top:8px"><input type="checkbox" id="an"> Kommentoi anonyymisti</label>`}`}
function likeLive(k){if(!LIVE.posts[k])return;const on=!(LIVE.likes[k]&&LIVE.likes[k][LIVE.uid]);LIVE.like(k,on).catch(e=>toast('Tykkäys epäonnistui: '+(e.code||e.message)));if(LIVE.mode==='demo')go('chat')}
async function addComment(k){const i=$('#cmi');if(!i||!i.value.trim())return;
 try{await LIVE.comment(k,{name:who(),text:i.value.trim().slice(0,200)});toast('Kommentti lisätty')}catch(e){toast('Kommentointi epäonnistui: '+(e.code||e.message))}go('chat')}
async function addT(){const a=$('#nti').value.trim(),b=$('#ntt').value.trim();if(!a||mine())return;
 try{await LIVE.post({name:who(),title:a.slice(0,80),text:b.slice(0,300),chan:S.chan});S.nt=false;toast('Viesti julkaistu 10 minuutiksi')}catch(e){toast('Viestin lähetys epäonnistui: '+(e.code||e.message))}go('chat')}
setInterval(()=>{const n=Date.now();for(const k in LIVE.posts){const p=LIVE.posts[k];if(p&&p.ts&&n-p.ts>=TTL+5000)LIVE.del(k).catch(()=>{})}LIVE.refresh()},15000);
let rot=0;
function spin(){S.spun=true;const P=['Kahvi ☕','Tarra','+20 p','Pingviini 🐧','+50 p','Kuppi'];
 const k=Math.floor(Math.random()*6);rot+=360*5+(360-(k*60+30));
 $('#spin').disabled=true;$('#wh').style.transform=`rotate(${rot}deg)`;
 setTimeout(()=>{if(k===2)S.pts+=20;if(k===4)S.pts+=50;toast('Voitit: '+P[k]+'!');pts();if(!$('#ov').classList.contains('hide'))closeOv();else go(S.cur)},4200)}
</script>
<script type="module">
const cfg={apiKey:"AIzaSyBg3oRuRVpwRlFvSxvhQavrxc4FrHioXng",authDomain:"palvelumuotoiluprojekti.firebaseapp.com",databaseURL:"https://palvelumuotoiluprojekti-default-rtdb.europe-west1.firebasedatabase.app",projectId:"palvelumuotoiluprojekti",storageBucket:"palvelumuotoiluprojekti.firebasestorage.app",messagingSenderId:"711705476345",appId:"1:711705476345:web:b6a9fe2683463c1e9ab628"};
try{
 const B='https://www.gstatic.com/firebasejs/10.12.2/';
 const {initializeApp}=await import(B+'firebase-app.js');
 const {getAuth,signInAnonymously}=await import(B+'firebase-auth.js');
 const {getDatabase,ref,onValue,set,remove,update,serverTimestamp}=await import(B+'firebase-database.js');
 const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);
 const cred=await signInAnonymously(auth),uid=cred.user.uid;
 const gone=k=>({['posts/'+k]:null,['likes/'+k]:null,['comments/'+k]:null});

  like:(pid,on)=>on?set(ref(db,'likes/'+pid+'/'+uid),true):remove(ref(db,'likes/'+pid+'/'+uid)),
  comment:(pid,c)=>set(ref(db,'comments/'+pid+'/'+uid),{...c,ts:serverTimestamp()}),
  del:pid=>update(ref(db),gone(pid))};
 await new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('timeout')),8000);
  onValue(ref(db,'posts'),s=>{clearTimeout(t);Object.assign(LIVE,mk);LIVE.posts=s.val()||{};LIVE.mode='fb';LIVE.uid=uid;LIVE.refresh();ok()},e=>{clearTimeout(t);no(e)})});
 onValue(ref(db,'likes'),s=>{LIVE.likes=s.val()||{};LIVE.refresh()},()=>{});
 onValue(ref(db,'comments'),s=>{LIVE.comments=s.val()||{};LIVE.refresh()},()=>{});
